<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Fume Ma Poule · Espace équipe</title>
</head>
<body class="page">
  <main class="shell gap-6">
    <header class="flex flex-col items-center gap-3">
      <div class="brand-logo">
        <img src="/src/assets/logo-fumemapoule.jpg" alt="Fume Ma Poule — CBD shop" class="w-full h-full object-cover rounded-full">
      </div>
      <p class="pill">Espace équipe</p>
    </header>

    <!-- Connexion de l'équipe -->
    <form id="loginForm" class="flex flex-col gap-4" novalidate>
      <label class="flex flex-col gap-1.5">
        <span class="field-label">Email</span>
        <input id="email" name="email" class="field" type="email" autocomplete="username" required>
      </label>
      <div class="flex flex-col gap-1.5">
        <label for="password" class="field-label">Mot de passe</label>
        <div class="relative">
          <input id="password" name="password" class="field pr-20" type="password" autocomplete="current-password" required>
          <button id="togglePassword" class="absolute inset-y-0 right-0 px-4 text-[10px] font-bold uppercase tracking-widest text-fmp-sage" type="button" aria-controls="password" aria-pressed="false">Afficher</button>
        </div>
      </div>
      <p id="loginError" class="text-xs text-fmp-rust min-h-4" role="alert"></p>
      <button id="loginBtn" class="btn-primary" type="submit">Se connecter</button>
    </form>

    <!-- Scan et actions, visibles une fois connecté -->
    <section id="staffPanel" class="hidden flex-col gap-4">
      <div class="rounded-2xl overflow-hidden border border-fmp-kraft/30 bg-black aspect-square">
        <video id="scanVideo" class="w-full h-full object-cover" muted playsinline></video>
      </div>
      <button id="scanBtn" class="btn-secondary" type="button">Scanner une carte</button>

      <div id="scanResult" class="hidden bg-fmp-cream/5 border border-fmp-cream/10 rounded-xl p-4 flex-col gap-3" aria-live="polite">
        <!-- Carte choisie par le client (indicateur du QR) : seule celle-ci reçoit le tampon ou le cadeau. -->
        <p id="cardBadge" class="card-badge"></p>
        <div class="flex items-baseline justify-between">
          <p id="clientName" class="text-lg font-black"></p>
          <p class="text-sm font-black"><span id="clientStamps">0</span>/10</p>
        </div>
        <p class="text-[12px] text-fmp-cream/70">10 tampons = <span id="cardReward" class="font-bold text-fmp-cream"></span></p>
        <button id="stampBtn" class="btn-primary" type="button">+1 tampon</button>
        <button id="rewardBtn" class="hidden btn-primary" type="button">🎁 Cadeau remis</button>
      </div>

      <p id="staffMessage" class="text-xs text-center min-h-4" role="status"></p>
      <button id="logoutBtn" class="text-[11px] text-fmp-cream/60 underline" type="button">Se déconnecter</button>
    </section>
  </main>

  <script type="module" src="/src/pages/equipe.js"></script>
</body>
</html>
